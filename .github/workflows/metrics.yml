name: metrics

on:
  schedule:
    # 12:00 UTC = 09:00 ART, every day.
    - cron: '0 12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [story-updated, pr-merged]

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Collect metrics
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: '901717994296'
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: yarn start

      - name: Commit report and snapshots
        run: |
          git config user.name "hercfit-metrics"
          git config user.email "metrics@users.noreply.github.com"
          git add reports state
          if git diff --staged --quiet; then
            echo "Sin cambios en el reporte."
          else
            git commit -m "chore(metrics): update report $(date -u +%Y-%m-%d)"
            git push
          fi
